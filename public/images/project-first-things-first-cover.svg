<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <rect width="800" height="480" fill="#FDF6EC"/>
  <!-- Warm paper texture bg -->
  <rect x="0" y="0" width="800" height="480" fill="url(#paper)" opacity="0.4"/>
  <defs>
    <radialGradient id="paper" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#F0E8D8"/>
    </radialGradient>
  </defs>

  <!-- Big frog silhouette -->
  <ellipse cx="400" cy="300" rx="90" ry="70" fill="#5C7A5C" opacity="0.85"/>
  <ellipse cx="400" cy="270" rx="70" ry="60" fill="#5C7A5C" opacity="0.85"/>
  <!-- Eyes -->
  <circle cx="375" cy="248" r="16" fill="#8BAD6E"/>
  <circle cx="425" cy="248" r="16" fill="#8BAD6E"/>
  <circle cx="378" cy="248" r="7" fill="#2A2A2A"/>
  <circle cx="428" cy="248" r="7" fill="#2A2A2A"/>
  <!-- Legs -->
  <ellipse cx="330" cy="330" rx="36" ry="18" fill="#5C7A5C" opacity="0.8" transform="rotate(-20 330 330)"/>
  <ellipse cx="470" cy="330" rx="36" ry="18" fill="#5C7A5C" opacity="0.8" transform="rotate(20 470 330)"/>

  <!-- Countdown: 5-4-3-2-1 -->
  <text x="130" y="190" font-family="Georgia, serif" font-size="64" fill="#C8956A" opacity="0.7" font-weight="bold">5</text>
  <text x="220" y="160" font-family="Georgia, serif" font-size="56" fill="#C8956A" opacity="0.55" font-weight="bold">4</text>
  <text x="300" y="140" font-family="Georgia, serif" font-size="48" fill="#C8956A" opacity="0.4" font-weight="bold">3</text>
  <text x="370" y="128" font-family="Georgia, serif" font-size="40" fill="#C8956A" opacity="0.3" font-weight="bold">2</text>
  <text x="430" y="120" font-family="Georgia, serif" font-size="32" fill="#C8956A" opacity="0.2" font-weight="bold">1</text>

  <!-- Title text -->
  <text x="400" y="420" font-family="Georgia, serif" font-size="22" fill="#5C4A3A" text-anchor="middle" letter-spacing="2">First Things First</text>
  <text x="400" y="448" font-family="Georgia, serif" font-size="13" fill="#8A7060" text-anchor="middle" letter-spacing="3">R I T U A L</text>
</svg>
